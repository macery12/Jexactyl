name: UI

on:
  push:
    branches:
      - "develop"
      - "3.x-develop"
  pull_request:
    branches:
      - "develop"
      - "3.x-develop"

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

jobs:
  quality:
    name: Lint, unit, build, and budgets
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --dir frontend test

      - name: Production build
        run: pnpm build:frontend

      - name: Bundle budgets
        run: pnpm --dir frontend budget

  browser:
    name: Playwright and axe
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production assets
        run: pnpm build:frontend

      - name: Install pinned Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: pnpm --dir frontend test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3

  lighthouse:
    name: Lighthouse ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        profile:
          - mobile
          - desktop
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production assets
        run: pnpm build:frontend

      - name: Public Lighthouse runs
        run: pnpm --dir frontend run test:lighthouse:${{ matrix.profile }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.profile }}-reports
          path: storage/app/lighthouse/${{ matrix.profile }}/
          retention-days: 3
